[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-agent"
version = "1.0.0"
description = "Autonomous, multimodal (text/vision/voice), 100% local AI terminal agent powered by Google Gemma 4 via Ollama"
readme = "README.md"
authors = [{ name = "Arjun Prabhulal" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["gemma", "gemma4", "ollama", "ai-agent", "llm", "cli", "local-llm", "agent", "multimodal", "vision", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
    "prompt_toolkit>=3.0.0",
    "numpy>=1.20.0",
    "sounddevice>=0.4.0",
    "SpeechRecognition>=3.8.0",
    "pocketsphinx>=5.0.0",
    "mss>=9.0.0"
]

[project.urls]
Homepage = "https://github.com/arjunprabhulal/gemma4-agent"
Repository = "https://github.com/arjunprabhulal/gemma4-agent"
Issues = "https://github.com/arjunprabhulal/gemma4-agent/issues"

[project.scripts]
gemma4-agent = "gemma_agent.cli:main"
gemma-agent = "gemma_agent.cli:main"
gemma4 = "gemma_agent.cli:main"

[tool.setuptools]
packages = ["gemma_agent"]
